name: DMI quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  structural-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate prompt and calibration guardrails
        run: node --test tests/*.test.mjs
